<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        div{
            display: inline-block;
            width: 50px;
            height: 50px;
            color: white;
            background-color: pink;
            text-align: center;
            padding-top: 10px;
            font-size: 30px;
            border: 2px solid gray;
        }
        .bk{
            background-color: skyblue;
        }
        .bk:hover{
            position: relative;
            top: 20px;
        }
        .cl:hover{
            position: relative;
            bottom: 20px;
        }
        img{
            width: 300px;
            height: 300px;
            position: absolute;
        }
        #t{
            text-align: center;
            text-shadow: 2px 2px skyblue;
            color: white;
            width: 30px;
            height: 30px;
            position: relative;
            left: 130px;
            top: 70px;
            background-color: pink;
        }
        #h{
            text-align: center;
            text-shadow: 2px 2px skyblue;
            color: white;
            width: 30px;
            height: 30px;
            position: relative;
            left: 130px;
            top: 90px;
            background-color: pink;
        }
    </style>
</head>
<body>
    <img src="모몽가1.jpg" alt="">
    <p id="t">T</p>
    <p id="h">H</p>
    <p id="a">A</p>
    <p id="n">N</p>
    <p id="k">K</p>
    <p id="s">S</p>
    <h1>Thanks</h1>
    <div>T</div>
    <div class="bk">h</div>
    <div class="cl">a</div>
    <div>n</div>
    <div class="bk">k</div>
    <div>s</div>
</body>
</html>
